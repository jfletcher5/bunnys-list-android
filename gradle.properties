# Keep Gradle memory modest for local development machines.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is required for Compose, lifecycle, and Hilt integrations.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Use the official Kotlin code style to keep formatting predictable.
kotlin.code.style=official
